name: Stream Kalshi Orderbook

on:
  # Fires every hour. Each job streams for 50 minutes then syncs to R2, finishing
  # comfortably within the 70-minute cap. The next trigger arrives while the current
  # job is still running — concurrency queuing ensures no gap in coverage.
  # If a job crashes, the next trigger fires within at most 1 hour.
  schedule:
    - cron: '0 * * * *'
  # Manual trigger for testing — set duration via the input below.
  workflow_dispatch:
    inputs:
      duration:
        description: 'Stream duration in seconds (default: 3000 = 50 min)'
        required: false
        default: '3000'

# Only one streaming job at a time. New triggers queue (not cancel) so there
# is no gap between runs during normal operation.
concurrency:
  group: stream-kalshi-orderbook
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    # Hard cap at 70 minutes. Stream runs 50 min; remaining time covers setup + R2 sync.
    timeout-minutes: 70

    permissions:
      contents: write   # needed to push data commits back to the repo

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for data commits
        run: |
          git config user.email "mattdowis@gmail.com"
          git config user.name "mdowis"

      - name: Stream orderbook data
        run: python scripts/stream_orderbook.py
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          STREAM_DURATION_SECONDS: ${{ github.event.inputs.duration || '3000' }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # When R2 is not configured, flush any data not yet committed to git.
      # When R2 IS configured, git data commits are skipped entirely — R2 is
      # the source of truth and the step below handles the upload.
      - name: Final git flush (no-op when R2 is configured)
        if: always()
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_BUCKET" ]; then
            echo "R2 configured — data goes to R2, skipping git data flush."
            exit 0
          fi
          git add data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: final flush $(date -u '+%Y-%m-%d %H:%M') UTC"
            git fetch origin $GITHUB_REF_NAME
            git reset --hard origin/$GITHUB_REF_NAME
            git add data/ 2>/dev/null || true
            git diff --cached --quiet || git commit -m "data: final flush $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "No uncommitted data to flush."
          fi

      # Upload every JSONL file written this session to Cloudflare R2.
      # Runs even if the stream step fails so partial data is never lost.
      # Skips gracefully if R2 secrets are not configured.
      - name: Sync data to Cloudflare R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "R2_BUCKET not set — skipping R2 sync."
            exit 0
          fi
          if [ ! -d data ] || [ -z "$(ls -A data 2>/dev/null)" ]; then
            echo "No data directory to sync."
            exit 0
          fi
          echo "Syncing data/ to s3://${R2_BUCKET}/data/ ..."
          aws s3 sync data/ "s3://${R2_BUCKET}/data/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress \
            --only-show-errors
          echo "R2 sync complete."

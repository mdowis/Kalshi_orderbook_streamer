name: Stream Kalshi Orderbook

on:
  # Fires every hour. Each job runs for 65 minutes, so the next trigger arrives
  # while the current job is still running — concurrency queuing ensures no gap.
  # If a job crashes, the next trigger fires within at most 1 hour.
  schedule:
    - cron: '0 * * * *'
  # Manual trigger for testing — set duration via the input below.
  workflow_dispatch:
    inputs:
      duration:
        description: 'Stream duration in seconds (default: 3900 = 65 min)'
        required: false
        default: '3900'

# Only one streaming job at a time. New triggers queue (not cancel) so there
# is no gap between runs during normal operation.
concurrency:
  group: stream-kalshi-orderbook
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    # Hard cap at 70 minutes — slightly above the 65-minute stream duration.
    timeout-minutes: 70

    permissions:
      contents: write   # needed to push data commits back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Persist credentials so git push works inside the streamer.
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for data commits
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Diagnose connection
        run: python scripts/diagnose.py
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}

      - name: Stream orderbook data
        run: python scripts/stream_orderbook.py
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          STREAM_DURATION_SECONDS: ${{ github.event.inputs.duration || '3900' }}

      # Flush any data that was written but not yet committed
      # (e.g. markets still open when the duration timer fired).
      - name: Final data flush
        if: always()
        run: |
          git add data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: final flush $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push || (git pull --rebase && git push)
          else
            echo "No uncommitted data to flush."
          fi
